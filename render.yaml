services:
  # ASTRA FastAPI Backend Service
  - type: web
    name: astra-mission-trainer-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////var/data/astra.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: astra-data
      mountPath: /var/data
      sizeGB: 1

  # ASTRA Mission Trainer Frontend Web Service
  - type: web
    name: astra-mission-trainer
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
