services:
  # ASTRA FastAPI Backend Service
  - type: web
    name: astra-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        value: sqlite:////var/data/astra.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: astra-data
      mountPath: /var/data
      sizeGB: 1

  # COSMOS 3D Planet Explorer Frontend Static Site
  - type: web
    name: cosmos-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
